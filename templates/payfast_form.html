<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to PayFast...</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center;
               align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
        .card { text-align: center; background: white; padding: 2rem 3rem;
                border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .spinner { border: 4px solid #eee; border-top: 4px solid #1d78a3;
                   border-radius: 50%; width: 40px; height: 40px;
                   animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #555; margin: 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <p>Redirecting to secure payment...</p>
    </div>

    <!-- PayFast payment form — auto-submits on load -->
    <form id="payfast-form"
        action="{{ 'https://sandbox.payfast.co.za/eng/process' if is_sandbox else 'https://www.payfast.co.za/eng/process' }}"
        method="POST" style="display:none;">

        {% for key, value in payfast.items() %}
            <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endfor %}
    </form>

    <script>
        setTimeout(function () {
            document.getElementById('payfast-form').submit();
        }, 800);
    </script>
</body>
</html>
